  <meta name="description" content="텀블러를 둘러보고 색상을 바꾸며 덮개와 빨대를 움직이는 3D 뷰어">
  <title>텀블러 · 3D</title>
  <link rel="icon" href="data:,">
  <!--
  전체 화면 3D 텀블러 — 이름이 있는 색상 팔레트
  ───────────────────────────────────────────────────────────────────────
  실행: 인터넷 연결 상태에서 이 HTML 파일을 Chrome / Edge 등으로 엽니다.
  Three.js와 부가 모듈만 CDN에서 가져옵니다. npm 설치, 외부 모델, 이미지,
  폰트 파일은 필요하지 않습니다. 파일 자체를 슬랙 등에 첨부할 수 있습니다.
  브라우저/조직 정책이 file:// 실행을 제한할 때는 로컬 서버에서 실행하세요.

  화면: 전체 화면 3D 공간 + 왼쪽 위 제품 소개 + 12색 격자 팔레트(색 견본과 이름)
        + 시점 초기화.
  조작: 드래그로 둘러보기 / 휠·핀치로 확대·축소 / 초기화 버튼으로 처음 시점.
        제품을 짧게 클릭·탭하면 덮개가 젖혀지고 빨대가
        올라옵니다. 다시 누르면 역순으로 닫힙니다. 드래그·핀치는 클릭과 구분합니다.
  실제 판매 제품의 구조를 재현한 모델이 아니라, 학습을 위해 단순화한 동작입니다.
  키보드: Tab으로 캔버스 선택 후 방향키로 시점 변경, +/-로 확대·축소,
          0 또는 Home으로 처음 시점, Enter / Space로 열기·닫기.
          색상 버튼도 Enter / Space로 선택합니다.

  [코드에서 바꿔 볼 곳]
  <header class="intro">  제품 이름, 소개 문구, 조작 안내 (HTML 본문)
  COLORS               색상 선택지. name은 표시 이름, hex는 실제 색상입니다.
                       항목을 추가하면 팔레트에 셀이 자동으로 추가됩니다.
  SETTINGS             기본 색상, 재질의 거칠기, 배경색, 조명 설정
  createTumbler()       텀블러 형태: 기본 도형과 회전체를 조합
  selectColor()         HTML 버튼 입력 → Material.color 변경
  ACTION               덮개 각도, 빨대 이동 거리, 전체 동작 시간
  createTumbler()       lidPivot / strawGroup: 따로 움직이는 부품을 Group으로 분리
  setProductOpen()      제품 클릭·키보드 → 열린 상태 / 닫힌 상태 변경
  applyProductPose()    진행도 0~1 → 덮개 회전·빨대 위치 (닫을 때는 역순)

  예시: ACTION.lidAngleDegrees를 95로, strawRise를 0.45로 바꿔 비교해 보세요.
  ACTION.durationSeconds를 키우면 동작이 느려집니다. 모델과 맞지 않는 극단적인
  각도·길이로 바꾸면 부품이 겹칠 수 있으므로 실행 결과를 직접 확인하세요.

  현재 색상, 시점과 열린 상태는 저장하지 않습니다. 새로고침하면 코드의 기본값으로
  돌아옵니다. 파일로 작품을 공유하려면 원하는 기본값을 코드에 반영하세요.

  Three.js r180 (0.180.0) 고정. 핵심 모듈과 addons는 같은 버전을 사용합니다.

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      color-scheme: light;
      color: #353731;
      background: #eeede9;
      --glass: rgba(255, 255, 253, .73);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    #viewport { position: fixed; inset: 0; touch-action: none; }
    #viewport canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; outline: none; }
    #viewport canvas:active { cursor: grabbing; }
    #viewport canvas:focus-visible { box-shadow: inset 0 0 0 2px #687566; }

    /* 전체 화면 3D는 그대로, 색 견본과 이름만 작은 격자 표로 표시합니다. */
    .dock {
      position: fixed;
      z-index: 5;
      right: max(28px, calc(env(safe-area-inset-right) + 16px));
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
      width: 352px;
      max-width: calc(100vw - 32px);
      border: 1px solid rgba(78, 83, 70, .12);
      border-radius: 16px;
      overflow: hidden;
      background: var(--glass);
      box-shadow: 0 8px 30px rgba(33, 36, 28, .055), 0 1px 3px rgba(33, 36, 28, .025);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: rgba(78, 83, 70, .085);
    }
    .swatch {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      min-height: 60px;
      margin: 0;
      padding: 9px 4px 8px;
      border: 0;
      border-radius: 0;
      background: rgba(252, 252, 249, .87);
      cursor: pointer;
      transition: background .18s ease;
    }
    .swatch-chip {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 19px;
      flex: 0 0 auto;
      border-radius: 5px;
      background: var(--swatch);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .07);
      transition: transform .18s ease;
    }
    .swatch-name {
      font-size: 11px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -.15px;
      white-space: nowrap;
      color: #666b61;
    }
    .swatch::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1.5px solid transparent;
      pointer-events: none;
      transition: border-color .18s ease;
    }
    .swatch[aria-pressed="true"] { background: #edf0e8; }
    .swatch[aria-pressed="true"]::after { border-color: #73816c; }
    .swatch[aria-pressed="true"] .swatch-name { color: #35452f; font-weight: 600; }
    .swatch-chip svg { width: 12px; height: 12px; color: var(--check); opacity: 0; }
    .swatch[aria-pressed="true"] .swatch-chip svg { opacity: 1; }
    .reset {
      position: fixed;
      z-index: 5;
      top: max(24px, calc(env(safe-area-inset-top) + 12px));
      right: max(28px, calc(env(safe-area-inset-right) + 16px));
      width: 42px;
      height: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(78, 83, 70, .1);
      border-radius: 50%;
      background: var(--glass);
      color: #62675d;
      cursor: pointer;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: background .18s ease, color .18s ease;
    }
    .reset svg { width: 18px; height: 18px; }
    .reset:active { background: #e7e9e0; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible { outline: 2px solid #546a51; outline-offset: -3px; }
    @media (hover: hover) {
      .swatch:hover:not(:disabled) { background: #f0f2eb; }
      .swatch:hover:not(:disabled) .swatch-chip { transform: translateY(-1px); }
      .reset:hover:not(:disabled) { background: #e3e8dd; color: #2c3529; }
    }
    /* 왼쪽 위 제품 소개. 상자 없이 글자만 두고, 글자 위에서도 드래그로 둘러볼 수 있습니다. */
    .intro {
      position: fixed;
      z-index: 3;
      top: max(40px, calc(env(safe-area-inset-top) + 24px));
      left: max(44px, calc(env(safe-area-inset-left) + 24px));
      width: 320px;
      max-width: calc(100vw - 120px);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .intro-title {
      margin: 0;
      font-size: clamp(34px, 3.6vw, 50px);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -.04em;
      color: #2c2f29;
    }
    .intro-color {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: #56604f;
    }
    .intro-color::before {
      content: "";
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--current, transparent);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
    }
    .intro-desc {
      margin: 20px 0 0;
      font-size: 14px;
      line-height: 1.75;
      word-break: keep-all;
      color: #5b6056;
    }
    .intro-hint {
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.6;
      word-break: keep-all;
      color: #8a8e84;
    }
    /* 조작 안내는 화면의 소개 문구와 접근성 텍스트에 함께 둡니다. */
    .loading {
      position: fixed; inset: 0; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      padding: 28px; text-align: center; pointer-events: none;
    }
    .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 340px; }
    .spinner { width: 24px; height: 24px; border: 1.5px solid #d3d7cc; border-top-color: #697d5f; border-radius: 50%; animation: spin .9s linear infinite; }
    .loading p { font-size: 13px; line-height: 1.8; word-break: keep-all; color: #61675a; margin: 0; }
    .loading.failed { background: rgba(238, 237, 233, .93); }
    .loading.failed .spinner { display: none; }
    .retry { pointer-events: auto; cursor: pointer; padding: 9px 15px; border: 1px solid #cfd3c7; background: #fffdf8; border-radius: 20px; font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    noscript { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #eeede9; padding: 30px; font-size: 14px; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 959px), (max-aspect-ratio: 1/1) {
      .dock {
        left: 50%; right: auto; transform: translateX(-50%);
        bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      }
      .reset { top: max(16px, calc(env(safe-area-inset-top) + 10px)); right: max(16px, env(safe-area-inset-right)); }
      .swatch { min-height: 56px; gap: 5px; padding-top: 8px; padding-bottom: 7px; }
      /* 좁은 화면: 소개를 작게 하고, 제품은 소개와 팔레트 사이에 배치합니다(fitViewport). */
      .intro { top: max(20px, calc(env(safe-area-inset-top) + 12px)); left: max(20px, env(safe-area-inset-left)); max-width: calc(100vw - 96px); }
      .intro-title { font-size: 30px; }
      .intro-color { margin-top: 8px; font-size: 13px; }
      .intro-desc { margin-top: 12px; font-size: 13px; line-height: 1.65; }
      .intro-hint { margin-top: 8px; }
    }
    @media (max-width: 599px) {
      .intro-desc { display: none; }
    }
    @media (max-width: 359px) {
      .dock { max-width: calc(100vw - 24px); }
      .swatch-name { font-size: 10.5px; }
    }
    /* 휴대폰 가로 방향에서는 작은 팔레트를 오른쪽으로 옮겨 제품 공간을 확보합니다. */
    @media (max-height: 500px) and (min-width: 600px) {
      .dock { left: auto; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); transform: none; width: 280px; }
      .swatch { min-height: 49px; padding: 6px 3px; gap: 4px; }
      .swatch-chip { width: 28px; height: 16px; }
      .swatch-name { font-size: 10.5px; }
      .intro { top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); width: 220px; }
      .intro-title { font-size: 22px; }
      .intro-color { margin-top: 6px; font-size: 12px; }
      .intro-desc, .intro-hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } .spinner { animation-duration: 2s; } }
  </style>

      "imports": {

</head>
<body>
  <noscript>3D 화면을 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  <main id="viewport" aria-label="텀블러 3D 공간" aria-busy="true"></main>

  <header class="intro">
    <h1 class="intro-title">텀블러</h1>
    <p id="intro-color" class="intro-color"></p>
    <p class="intro-desc">덮개를 젖히면 빨대가 올라오는 원터치 텀블러.<br>한 손으로 열고 바로 마실 수 있습니다.</p>
    <p class="intro-hint">끌어서 둘러보고, 제품을 눌러 열어 보세요.</p>
  </header>

  <div class="dock" role="group" aria-label="텀블러 색상 팔레트">
    <div id="swatches" class="swatches" role="group" aria-label="색상 견본과 이름, 선택하면 본체 색상이 바뀝니다"></div>
  </div>
  <button id="reset-button" class="reset" type="button" aria-label="처음 시점으로 돌아가기" title="처음 시점" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.6 9a8 8 0 1 1 .6 7"/></svg>
  </button>
  <p id="color-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="action-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="controls-help" class="sr-only">마우스로 드래그하거나 방향키로 둘러봅니다. 스크롤, 두 손가락, 더하기와 빼기 키로 확대·축소합니다. 제품을 짧게 클릭하거나 Enter 또는 Space 키로 덮개를 열고 닫습니다. Home 또는 0 키로 처음 시점으로 돌아갑니다.</p>

  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-inner">
      <span class="spinner" aria-hidden="true"></span>
      <span id="loading-status" class="sr-only">3D 화면을 불러오는 중입니다.</span>
      <p id="loading-message" hidden></p>
      <button id="retry-button" class="retry" type="button" hidden>다시 불러오기</button>
    </div>
  </div>

  <script>
    // 네트워크나 그래픽 초기화가 실패한 경우에만 설명을 표시합니다.
    window.viewerLoadFailure = function (message) {
      const box = document.getElementById('loading');
      box.hidden = false;
      box.classList.add('failed');
      document.getElementById('loading-status').textContent = '3D 화면을 불러오지 못했습니다.';
      const text = document.getElementById('loading-message');
      text.textContent = message;
      text.hidden = false;
      document.getElementById('retry-button').hidden = false;
      document.getElementById('viewport').setAttribute('aria-busy', 'false');
      document.querySelectorAll('.swatch, .reset').forEach(button => button.disabled = true);
    };
    document.getElementById('retry-button').addEventListener('click', () => location.reload());
    window.viewerLoadTimer = setTimeout(() => {
      if (document.getElementById('loading').hidden) return;
      const text = document.getElementById('loading-message');
      text.textContent = '불러오기가 지연되고 있습니다. 인터넷 연결을 확인해 주세요.';
      text.hidden = false;
      document.getElementById('retry-button').hidden = false;
    }, 15000);
  </script>

  <script type="module">
    // ── 0. 설정: 색상 추가 / 재질 변경 / 기본 조명 ──────────────────────
    const COLORS = [
      { name: '아이보리',   hex: '#F1EEE6', ink: '#54564E' },
      { name: '크림',       hex: '#DBCDAF', ink: '#514B3D' },
      { name: '버터',       hex: '#E6C966', ink: '#655524' },
      { name: '테라코타',   hex: '#B96C50', ink: '#FFFFFF' },
      { name: '코랄',       hex: '#DD8274', ink: '#FFFFFF' },
      { name: '로즈',       hex: '#CCA0B0', ink: '#5C3C4A' },
      { name: '라벤더',     hex: '#A99BC9', ink: '#443951' },
      { name: '스카이',     hex: '#85B7D4', ink: '#244E65' },
      { name: '민트',       hex: '#9FCDBE', ink: '#305E4E' },
      { name: '세이지',     hex: '#7E9273', ink: '#FFFFFF' },
      { name: '포레스트',   hex: '#355C4A', ink: '#FFFFFF' },
      { name: '미드나이트', hex: '#3A4657', ink: '#FFFFFF' }
    ];
    const SETTINGS = {
      defaultColor: 9, // COLORS의 세이지. 배열 순서는 0부터 셉니다.
      roughness: 0.53,
      background: '#EEEDE9',
      keyColor: '#FFF9F0',
      keyIntensity: 3.0,
      environmentIntensity: 0.65
    };
    // ★ 제품별 동작의 설정: 세 값만 바꿔도 움직임이 달라집니다.
    const ACTION = {
      lidAngleDegrees: 112,  // 뒤쪽 경첩을 기준으로 덮개가 열리는 각도
      strawRise: 0.62,       // 빨대가 올라오는 거리 (장면의 좌표 단위)
      durationSeconds: 1.05  // 닫힘→열림 전체 시간 (초)
    };
    const $ = id => document.getElementById(id);
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const colorButtons = [];
    let selectedIndex = Math.max(0, Math.min(SETTINGS.defaultColor, COLORS.length - 1));
    let ready = false;
    let material, renderer, scene, camera, controls;
    let renderFrame = 0;
    let currentHomeDistance = 0;
    let resetView = () => {};
    let applyProductPose = () => {};
    const productState = { open: false, progress: 0 };
    let previousAnimationTime = 0;

    // 외부 모듈을 받기 전에도 UI 모양은 표시합니다. 준비 전에는 조작을 막습니다.
    document.documentElement.style.background = SETTINGS.background;
    COLORS.forEach((color, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch';
      button.disabled = true;
      button.style.setProperty('--swatch', color.hex);
      button.style.setProperty('--check', color.ink);
      button.setAttribute('aria-label', color.name + ' 선택');
      button.setAttribute('aria-pressed', String(index === selectedIndex));
      button.title = color.name;
      // 표의 각 셀 = 색 견본 + 색상명. 이름은 textContent로 안전하게 삽입합니다.
      const chip = document.createElement('span');
      chip.className = 'swatch-chip';
      chip.setAttribute('aria-hidden', 'true');
      chip.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 10 3 3 7-7"/></svg>';
      const name = document.createElement('span');
      name.className = 'swatch-name';
      name.textContent = color.name;
      button.append(chip, name);
      button.addEventListener('click', () => selectColor(index));
      $('swatches').append(button);
      colorButtons.push(button);
    });
    showColorName(selectedIndex);

    try {
      const [THREE, { OrbitControls }, { RoomEnvironment }] = await Promise.all([
        import('three'),
        import('three/addons/controls/OrbitControls.js'),
        import('three/addons/environments/RoomEnvironment.js')
      ]);

      // ── 1. Scene: 화면 전체가 하나의 3D 공간 ────────────────────────
      scene = new THREE.Scene();
      scene.background = new THREE.Color(SETTINGS.background);

      // ── 2. Camera: 제품 중심을 바라보는 카메라 ─────────────────────
      camera = new THREE.PerspectiveCamera(32, 1, 0.1, 80);
      const homeTarget = new THREE.Vector3(0, 1.60, 0);
      const homeDirection = new THREE.Vector3(0.46, 0.34, 0.854).normalize();
      camera.position.copy(homeTarget).addScaledVector(homeDirection, 8.8);
      camera.lookAt(homeTarget);

      // ── 3. Renderer: 창 전체 크기로 canvas 렌더링 ──────────────────
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.domElement.tabIndex = 0;
      renderer.domElement.setAttribute('aria-label', '텀블러 3D 뷰어, 닫힘. 클릭하거나 Enter 키로 열기');
      renderer.domElement.setAttribute('aria-describedby', 'controls-help');
      $('viewport').append(renderer.domElement);
      renderer.domElement.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        ready = false;
        if (renderFrame) cancelAnimationFrame(renderFrame);
        renderFrame = 0;
        window.viewerLoadFailure('그래픽 연결이 중단되었습니다. 다른 탭을 닫은 뒤 다시 불러와 주세요.');
      });

      // ── 4. Light: 외부 HDR 파일 없이 스튜디오 빛 만들기 ────────────
      const room = new RoomEnvironment();
      const pmrem = new THREE.PMREMGenerator(renderer);
      const environment = pmrem.fromScene(room, 0.04);
      scene.environment = environment.texture;
      scene.environmentIntensity = SETTINGS.environmentIntensity;
      room.dispose();
      pmrem.dispose();

      scene.add(new THREE.HemisphereLight('#FFFFFF', '#C5C5BC', 1.2));
      const keyLight = new THREE.DirectionalLight(SETTINGS.keyColor, SETTINGS.keyIntensity);
      keyLight.position.set(-3.5, 6, 4.5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      Object.assign(keyLight.shadow.camera, { left: -4, right: 4, top: 5, bottom: -4, near: 0.5, far: 18 });
      keyLight.shadow.camera.updateProjectionMatrix();
      keyLight.shadow.normalBias = 0.025;
      keyLight.shadow.bias = -0.00015;
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight('#DFE8F4', 1.2);
      fillLight.position.set(4, 3, -3);
      scene.add(fillLight);

      // ── 5. Mesh: 로고 없는 텀블러. 외부 모델/이미지를 쓰지 않습니다. ──
      material = new THREE.MeshStandardMaterial({
        color: COLORS[selectedIndex].hex,
        roughness: SETTINGS.roughness,
        metalness: 0
      });
      const dark = new THREE.MeshStandardMaterial({ color: '#333A35', roughness: 0.45 });
      const rubber = new THREE.MeshStandardMaterial({ color: '#292E29', roughness: 0.82 });
      const metal = new THREE.MeshStandardMaterial({ color: '#C9C9C4', metalness: 1, roughness: 0.27 });

      function addMesh(parent, geometry, surface, x = 0, y = 0, z = 0) {
        const mesh = new THREE.Mesh(geometry, surface);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }
      function lathe(parent, points, surface) {
        return addMesh(parent, new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), 96), surface);
      }
      function ring(parent, radius, tube, y, surface) {
        const mesh = addMesh(parent, new THREE.TorusGeometry(radius, tube, 12, 96), surface, 0, y, 0);
        mesh.rotation.x = Math.PI / 2;
        return mesh;
      }
      // XZ 평면의 작은 둥근 판. 덮개와 고무 패드를 같은 형태로 구성합니다.
      function roundedPlate(width, length, thickness, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2, y = -length / 2;
        const r = Math.min(radius, width / 2, length / 2);
        shape.moveTo(x + r, y);
        shape.lineTo(x + width - r, y);
        shape.quadraticCurveTo(x + width, y, x + width, y + r);
        shape.lineTo(x + width, y + length - r);
        shape.quadraticCurveTo(x + width, y + length, x + width - r, y + length);
        shape.lineTo(x + r, y + length);
        shape.quadraticCurveTo(x, y + length, x, y + length - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: thickness, bevelEnabled: true, bevelSize: 0.012,
          bevelThickness: 0.012, bevelSegments: 3, steps: 1, curveSegments: 14
        });
        geometry.rotateX(-Math.PI / 2);
        return geometry;
      }

      function createTumbler() {
        const group = new THREE.Group();
        group.name = 'tumbler';
        // [반지름, 높이]로 옆모습을 정의하고 Y축을 중심으로 회전시킵니다.
        const body = lathe(group, [
          [0.001, 0.075], [0.64, 0.075], [0.683, 0.084], [0.708, 0.115],
          [0.716, 0.20], [0.846, 2.65], [0.85, 2.70], [0.844, 2.735],
          [0.80, 2.75], [0.001, 2.75]
        ], material);
        body.name = 'body';
        addMesh(group, new THREE.CylinderGeometry(0.689, 0.673, 0.06, 96), rubber, 0, 0.055);
        addMesh(group, new THREE.CylinderGeometry(0.841, 0.842, 0.065, 96), metal, 0, 2.746);
        ring(group, 0.828, 0.018, 2.773, metal);

        // 고정된 뚜껑 하부. 움직이는 작은 덮개와 분리합니다.
        lathe(group, [
          [0.72, 2.775], [0.80, 2.775], [0.86, 2.794], [0.869, 2.822],
          [0.865, 2.895], [0.84, 2.927], [0.79, 2.936],
          [0.76, 2.91], [0.72, 2.88], [0.72, 2.775]
        ], dark);

        // 윗판에 실제 구멍을 뚫어 빨대가 통과하게 합니다.
        const topShape = new THREE.Shape();
        topShape.absarc(0, 0, 0.809, 0, Math.PI * 2, false);
        const strawHole = new THREE.Path();
        strawHole.absarc(0, -0.40, 0.108, 0, Math.PI * 2, true);
        topShape.holes.push(strawHole);
        const topGeometry = new THREE.ExtrudeGeometry(topShape, {
          depth: 0.042, bevelEnabled: false, steps: 1, curveSegments: 64
        });
        topGeometry.rotateX(-Math.PI / 2);
        addMesh(group, topGeometry, dark, 0, 2.897);
        ring(group, 0.769, 0.014, 2.940, rubber);
        const port = ring(group, 0.098, 0.017, 2.947, rubber);
        port.position.z = 0.40;

        // 경첩 축은 X방향. 덮개의 중심이 아니라 뒤쪽 끝에서 회전합니다.
        const hingeZ = -0.18;
        const hingeY = 3.005;
        const hingeBar = addMesh(group, new THREE.CylinderGeometry(0.063, 0.063, 0.60, 32), dark, 0, hingeY, hingeZ);
        hingeBar.rotation.z = Math.PI / 2;
        [-1, 1].forEach(sign => {
          addMesh(group, new THREE.BoxGeometry(0.09, 0.07, 0.12), dark, sign * 0.245, 2.977, hingeZ);
          const pin = addMesh(group, new THREE.CylinderGeometry(0.042, 0.042, 0.025, 24), metal, sign * 0.31, hingeY, hingeZ);
          pin.rotation.z = Math.PI / 2;
        });

        const lidPivot = new THREE.Group();
        lidPivot.name = 'lidPivot';
        lidPivot.position.set(0, hingeY, hingeZ);
        group.add(lidPivot);
        const lidMaterial = new THREE.MeshStandardMaterial({ color: '#40483F', roughness: 0.43 });
        const flap = addMesh(lidPivot, roundedPlate(0.56, 0.94, 0.035, 0.16), lidMaterial, 0, -0.002, 0.39);
        flap.name = 'lidCover';
        addMesh(lidPivot, roundedPlate(0.45, 0.82, 0.015, 0.12), rubber, 0, -0.022, 0.39);
        for (let i = 0; i < 3; i++) {
          addMesh(lidPivot, new THREE.BoxGeometry(0.27, 0.008, 0.012), rubber, 0, 0.047, 0.52 + i * 0.055);
        }

        // 빨대도 독립 Group으로 구성합니다. 속이 빈 회전체라 입구가 보입니다.
        const strawGroup = new THREE.Group();
        strawGroup.name = 'strawGroup';
        const strawRestY = 2.18;
        strawGroup.position.set(0, strawRestY, 0.40);
        group.add(strawGroup);
        const strawMaterial = new THREE.MeshStandardMaterial({ color: '#E9E5D8', roughness: 0.39 });
        lathe(strawGroup, [
          [0.050, 0], [0.073, 0], [0.073, 0.665],
          [0.080, 0.735], [0.080, 0.767], [0.073, 0.780],
          [0.054, 0.780], [0.050, 0.767], [0.050, 0]
        ], strawMaterial);
        const bore = addMesh(strawGroup, new THREE.CircleGeometry(0.050, 32), rubber, 0, 0.48);
        bore.rotation.x = -Math.PI / 2;

        return { group, lidPivot, strawGroup, strawRestY };
      }
      const parts = createTumbler();
      const tumbler = parts.group;
      scene.add(tumbler);

      // 진행도는 0=닫힘, 1=열림. 같은 곡선을 역으로 따라가면 순서도 역전됩니다.
      // 1) 덮개가 먼저 열림  2) 빨대가 올라옴
      // 닫을 때는 1) 빨대가 먼저 내려감  2) 덮개가 닫힘
      const smoothRange = (value, start, end) => {
        const t = THREE.MathUtils.clamp((value - start) / (end - start), 0, 1);
        return t * t * (3 - 2 * t);
      };
      applyProductPose = progress => {
        const lidAmount = smoothRange(progress, 0, 0.65);
        const strawAmount = smoothRange(progress, 0.40, 1);
        parts.lidPivot.rotation.x = -THREE.MathUtils.degToRad(ACTION.lidAngleDegrees) * lidAmount;
        parts.strawGroup.position.y = parts.strawRestY + ACTION.strawRise * strawAmount;
      };
      applyProductPose(0);

      // 받침대는 없애고 그림자만 둡니다. 배경과 바닥의 경계도 보이지 않습니다.
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ color: '#383D31', opacity: 0.11 }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0.012;
      floor.receiveShadow = true;
      scene.add(floor);

      // 접지 그림자 역시 코드로 생성하므로 별도 이미지 파일이 필요하지 않습니다.
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = shadowCanvas.height = 128;
      const context = shadowCanvas.getContext('2d');
      if (!context) throw new Error('그림자를 위한 Canvas 2D를 만들지 못했습니다.');
      const gradient = context.createRadialGradient(64, 64, 2, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(37, 44, 32, 0.27)');
      gradient.addColorStop(0.45, 'rgba(37, 44, 32, 0.16)');
      gradient.addColorStop(1, 'rgba(37, 44, 32, 0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      const contact = new THREE.Mesh(new THREE.PlaneGeometry(2.55, 2.55), new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false, toneMapped: false
      }));
      contact.rotation.x = -Math.PI / 2;
      contact.position.y = 0.015;
      scene.add(contact);

      // ── 6. OrbitControls: 어디서나 드래그하여 둘러보기 ──────────────
      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(homeTarget);
      controls.enableDamping = !reduceMotion;
      controls.dampingFactor = 0.075;
      controls.enablePan = false;
      controls.rotateSpeed = 0.65;
      controls.zoomSpeed = 0.8;
      controls.minPolarAngle = 0.22;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.autoRotate = false;
      controls.update();
      controls.addEventListener('change', requestRender);

      resetView = () => {
        const damping = controls.enableDamping;
        controls.enableDamping = false;
        controls.update(); // 조작 중 남은 관성부터 비웁니다.
        controls.target.copy(homeTarget);
        camera.position.copy(homeTarget).addScaledVector(homeDirection, currentHomeDistance || 8.8);
        controls.update();
        controls.enableDamping = damping;
        requestRender();
      };
      $('reset-button').addEventListener('click', resetView);

      // 클릭한 화면 좌표 → Raycaster → 텀블러의 부품인지 확인합니다.
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const canvas = renderer.domElement;
      function hitsProduct(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return false;
        pointer.set((clientX - rect.left) / rect.width * 2 - 1,
                    -(clientY - rect.top) / rect.height * 2 + 1);
        camera.updateMatrixWorld();
        tumbler.updateWorldMatrix(true, true);
        raycaster.setFromCamera(pointer, camera);
        return raycaster.intersectObject(tumbler, true).length > 0;
      }

      // 드래그·핀치 후 손을 떼는 것을 제품 클릭으로 잘못 처리하지 않습니다.
      const activePointers = new Set();
      let clickCandidate = null;
      canvas.addEventListener('pointerdown', event => {
        activePointers.add(event.pointerId);
        if (activePointers.size !== 1 || event.button !== 0) {
          clickCandidate = null;
          return;
        }
        clickCandidate = {
          id: event.pointerId, x: event.clientX, y: event.clientY,
          started: performance.now(), moved: false,
          threshold: event.pointerType === 'touch' ? 10 : 6
        };
        canvas.style.cursor = 'grabbing';
      }, { capture: true });
      canvas.addEventListener('pointermove', event => {
        if (clickCandidate && event.pointerId === clickCandidate.id) {
          const distance = Math.hypot(event.clientX - clickCandidate.x, event.clientY - clickCandidate.y);
          if (distance > clickCandidate.threshold) clickCandidate.moved = true;
        }
        if (!activePointers.size && event.pointerType === 'mouse' && ready) {
          canvas.style.cursor = hitsProduct(event.clientX, event.clientY) ? 'pointer' : 'grab';
        }
      }, { capture: true });
      canvas.addEventListener('pointerup', event => {
        const candidate = clickCandidate;
        const movedAtRelease = candidate ? Math.hypot(event.clientX - candidate.x, event.clientY - candidate.y) > candidate.threshold : true;
        const isClick = ready && candidate && candidate.id === event.pointerId &&
          activePointers.size === 1 && !candidate.moved && !movedAtRelease &&
          performance.now() - candidate.started < 650;
        activePointers.delete(event.pointerId);
        clickCandidate = null;
        if (isClick && hitsProduct(event.clientX, event.clientY)) {
          setProductOpen(!productState.open);
        }
        canvas.style.cursor = event.pointerType === 'mouse' && hitsProduct(event.clientX, event.clientY) ? 'pointer' : 'grab';
      }, { capture: true });
      canvas.addEventListener('pointercancel', event => {
        activePointers.delete(event.pointerId);
        clickCandidate = null;
        canvas.style.cursor = 'grab';
      }, { capture: true });
      canvas.addEventListener('pointerleave', () => { if (!activePointers.size) canvas.style.cursor = 'grab'; });
      renderer.domElement.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const key = event.key;
        if (key === ' ' || key === 'Enter') { event.preventDefault(); if (!event.repeat) setProductOpen(!productState.open); return; }
        if (key === '0' || key === 'Home') { event.preventDefault(); resetView(); return; }
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '+', '=', '-', '_'].includes(key)) return;
        event.preventDefault();
        const spherical = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
        spherical.theta += key === 'ArrowLeft' ? -0.12 : key === 'ArrowRight' ? 0.12 : 0;
        spherical.phi += key === 'ArrowUp' ? -0.09 : key === 'ArrowDown' ? 0.09 : 0;
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, controls.minPolarAngle, controls.maxPolarAngle);
        if (key === '+' || key === '=') spherical.radius *= 0.91;
        if (key === '-' || key === '_') spherical.radius *= 1.1;
        spherical.radius = THREE.MathUtils.clamp(spherical.radius, controls.minDistance, controls.maxDistance);
        camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(spherical));
        controls.update();
        requestRender();
      });

      // ── 7. 반응형: canvas는 항상 전체 화면, 세로 화면에서도 제품이 맞게 ─
      function fitViewport() {
        const width = $('viewport').clientWidth;
        const height = $('viewport').clientHeight;
        if (!width || !height) return;
        const aspect = width / height;
        const dockRect = document.querySelector('.dock').getBoundingClientRect();
        const introRect = document.querySelector('.intro').getBoundingClientRect();
        const compact = matchMedia('(max-width: 959px), (max-aspect-ratio: 1/1)').matches;
        const landscape = height <= 500 && width >= 600;
        // 아래쪽 팔레트는 제품과 겹치지 않게, 가로 화면의 팔레트는 오른쪽에 둡니다.
        // 세로 화면에서는 위쪽 제품 소개 아래부터 제품이 보이게 합니다.
        const reservedBottom = compact && !landscape ? height - dockRect.top + 12 : 0;
        const reservedTop = compact && !landscape ? introRect.bottom + 8 : 0;
        const reservedRight = landscape ? width - dockRect.left + 14 : 0;
        const usableHeight = Math.max(height * 0.4, height - reservedBottom - reservedTop);
        const usableWidth = Math.max(width * 0.45, width - reservedRight);
        camera.aspect = aspect;
        camera.setViewOffset(width, height, reservedRight / 2, (reservedBottom - reservedTop) / 2, width, height);
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(width, height, false);
        const nextDistance = Math.max(8.8 * height / usableHeight, 4.05 * height / usableWidth);
        if (currentHomeDistance) {
          // 창 크기를 바꿔도 사용자가 고른 각도와 상대적인 확대 정도를 유지합니다.
          camera.position.sub(controls.target).multiplyScalar(nextDistance / currentHomeDistance).add(controls.target);
        } else {
          camera.position.copy(homeTarget).addScaledVector(homeDirection, nextDistance);
        }
        currentHomeDistance = nextDistance;
        controls.minDistance = currentHomeDistance * 0.55;
        controls.maxDistance = currentHomeDistance * 2.25;
        controls.update();
        requestRender();
      }
      const resizeObserver = new ResizeObserver(fitViewport);
      resizeObserver.observe($('viewport'));
      resizeObserver.observe(document.querySelector('.dock')); // 색상 개수가 바뀌어도 여백을 다시 계산합니다.
      resizeObserver.observe(document.querySelector('.intro')); // 소개 문구 길이가 바뀌어도 마찬가지입니다.
      fitViewport();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (renderFrame) cancelAnimationFrame(renderFrame);
          renderFrame = 0;
        } else { previousAnimationTime = performance.now(); requestRender(); }
      });

      ready = true;
      selectColor(selectedIndex);
      document.querySelectorAll('.swatch, .reset').forEach(button => button.disabled = false);
      // 첫 렌더링도 try 내부에서 수행하여 실제 초기화 오류를 안내합니다.
      renderer.render(scene, camera);
      clearTimeout(window.viewerLoadTimer);
      $('loading').hidden = true;
      $('viewport').setAttribute('aria-busy', 'false');
      requestRender();
      // 화면에 실습 패널은 없지만 개발자 도구에서는 구성 요소를 확인할 수 있습니다.
      window.viewer = {
        scene, camera, renderer, controls, material, tumbler, keyLight,
        selectColor, resetView, requestRender, setProductOpen,
        parts, actionSettings: ACTION,
        get state() { return { ...productState }; }
      };
    } catch (error) {
      ready = false;
      clearTimeout(window.viewerLoadTimer);
      console.error('3D 초기화 실패:', error);
      window.viewerLoadFailure(/WebGL|context|shader/i.test(String(error))
        ? '3D 그래픽을 시작하지 못했습니다. 브라우저의 그래픽 가속 설정을 확인하거나 다른 브라우저에서 열어 주세요.'
        : '3D 화면을 불러오지 못했습니다. 인터넷 연결과 CDN 접속을 확인하고, 파일을 내려받아 브라우저에서 열어 주세요.');
    }

    // 핵심 연결: 버튼 클릭 → 선택한 색상을 본체 재질과 UI에 반영
    function selectColor(index) {
      if (!ready || !COLORS[index]) return;
      selectedIndex = index;
      material.color.set(COLORS[index].hex);
      colorButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      // 선택 표시와 접근성 안내를 함께 갱신합니다. 색상명은 모든 셀에 표시합니다.
      $('color-status').textContent = COLORS[index].name + ' 선택됨';
      showColorName(index);
      requestRender();
    }
    // 제품 소개의 제목 아래에 지금 선택한 색상명과 색 점을 표시합니다.
    function showColorName(index) {
      const label = $('intro-color');
      label.textContent = COLORS[index].name;
      label.style.setProperty('--current', COLORS[index].hex);
    }
    // ★ 입력 → 상태 변경: 제품 클릭과 캔버스 키보드 입력만 사용합니다. 별도 동작 버튼은 없습니다.
    function setProductOpen(open) {
      if (!ready) return;
      productState.open = Boolean(open);
      renderer.domElement.setAttribute('aria-label', productState.open
        ? '텀블러 3D 뷰어, 열림. 클릭하거나 Enter 키로 닫기'
        : '텀블러 3D 뷰어, 닫힘. 클릭하거나 Enter 키로 열기');
      // 애니메이션 중 반대로 눌러도 현재 진행도에서 출발하므로 위치가 튀지 않습니다.
      previousAnimationTime = performance.now();
      if (reduceMotion) {
        productState.progress = productState.open ? 1 : 0;
        applyProductPose(productState.progress);
        announceProductState();
      }
      requestRender();
    }
    function announceProductState() {
      $('action-status').textContent = productState.open
        ? '덮개가 열리고 빨대가 올라왔습니다.'
        : '빨대가 들어가고 덮개가 닫혔습니다.';
    }
    // ★ 시간 → 진행도 → 부품의 위치·회전. 외부 애니메이션 라이브러리는 없습니다.
    function updateProductAnimation(now) {
      const target = productState.open ? 1 : 0;
      if (productState.progress === target) return false;
      const deltaSeconds = Math.max(0, Math.min((now - previousAnimationTime) / 1000, 0.06));
      previousAnimationTime = now;
      const step = deltaSeconds / Math.max(0.05, ACTION.durationSeconds);
      productState.progress = target > productState.progress
        ? Math.min(target, productState.progress + step)
        : Math.max(target, productState.progress - step);
      applyProductPose(productState.progress);
      if (productState.progress === target) announceProductState();
      return productState.progress !== target;
    }
    // 정지 상태에서는 GPU 작업을 멈추고 조작·색상 변경·애니메이션 시 다시 그립니다.
    function requestRender() {
      if (!ready || renderFrame || document.hidden) return;
      renderFrame = requestAnimationFrame(render);
    }
    function render(now) {
      renderFrame = 0;
      if (!ready || document.hidden) return;
      const animating = updateProductAnimation(now);
      controls.update();
      renderer.render(scene, camera);
      if (animating) requestRender();
      // 관성이 남아 있을 때는 Controls의 change 이벤트가 다음 프레임을 요청합니다.
    }
  </script>
</body>
</html>
